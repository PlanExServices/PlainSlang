<style>
:root{--bg:#0b0d12;--bg-elev:#12151d;--bg-card:#161a24;--bg-card-hover:#1b2030;--border:#262c3d;--border-strong:#343c52;--text:#eef1f8;--text-dim:#9aa3b8;--text-faint:#6b7489;--accent:#a78bfa;--accent-strong:#8b5cf6;--green:#4ade80;--amber:#fbbf24;--red:#f87171;--pink:#f472b6;--cyan:#22d3ee;--radius:16px;--radius-sm:10px;--tab-h:64px}

.pack-list{display:flex;flex-direction:column;gap:10px}

<script>
'use strict';
/* PlainSlang — static edition. Data regenerated daily by GitHub Actions
   (scripts/daily-verify.mjs): live news verification + guide radar, committed
   to data.json. No backend. */

const AGE_GROUPS=[
 {id:'elementary',label:'Elementary',short:'K–5',emoji:'🎒'},
 {id:'middle',label:'Middle school',short:'6–8',emoji:'📚'},
 {id:'high_school',label:'High school',short:'9–12',emoji:'🎓'},
 {id:'college',label:'College',short:'18+',emoji:'🏛️'},
 {id:'gen_alpha',label:'Gen Alpha core',short:'α',emoji:'🧃'},
 {id:'gen_z',label:'Gen Z core',short:'Z',emoji:'📱'}];
const AGE_COLORS={elementary:'#4ade80',middle:'#22d3ee',high_school:'#a78bfa',college:'#f472b6',gen_alpha:'#fbbf24',gen_z:'#f87171'};

const lsGet=(k,f)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch{return f}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const savedIds=()=>lsGet(LS.saved,[]);
const toggleSaved=id=>{const s=savedIds();const n=s.includes(id)?s.filter(x=>x!==id):[...s,id];lsSet(LS.saved,n);return n.includes(id)};
const getNote=id=>lsGet(LS.notes,{})[String(id)]||'';

function badge(t,curCat){

 if((t.tags||[]).includes('parent-alert'))h+='<span class="badge alert" title="Worth a real conversation">⚠️</span>';
 if(t.isWoty)h+='<span class="badge woty">WOTY</span>';

 if(curCat&&t.category!==curCat)h+='<span class="badge xlink" title="Home pack: '+esc(catInfo(t.category).label)+'">'+catInfo(t.category).emoji+'</span>';
 if(curCat==='teen'&&t.category==='teen'){const a=ageInfo(t.ageGroup);h+='<span class="badge age">'+a.emoji+' '+esc(a.short)+'</span>'}
 return h;
}

 document.querySelectorAll('.tab-item').forEach(el=>{
  const t=el.dataset.tab;
  const active=(t==='home'&&page==='home')||(t==='glossary'&&(page==='glossary'||page==='term'))||(t==='explore'&&(page==='explore'||page==='pack'))||(t===page);
  el.classList.toggle('active',active);
 });
 if(!DATA)return;
 window.scrollTo(0,0);
 document.querySelectorAll('.az-rail').forEach(e=>e.remove());
 if(page==='home')renderHome();
 else if(page==='glossary')renderBrowser('teen');
 else if(page==='explore')renderExplore();
 else if(page==='pack')renderPack(parts[1]);
 else if(page==='trending')renderTrending();

}

function parentRank(p){
 if(p>=80)return{t:'Certified Rizzler 😎',b:'You could pass as a group-chat member.'};
 if(p>=60)return{t:'Pretty Based 👌',b:'The kids might actually be impressed.'};
 if(p>=40)return{t:'Mid… no cap 😬',b:'Respectable, but keep studying.'};
 if(p>=1)return{t:'Kinda Cheugy 🧀',b:'It\u2019s giving "how do you do, fellow kids."'};
 return{t:'NPC Energy 🤖',b:'Time to hit the glossary.'};
}
function newQuiz(){

 const picks=[];const used=new Set();
 while(picks.length<3){const t=teen[Math.floor(Math.random()*teen.length)];if(!used.has(t.id)){used.add(t.id);picks.push(t)}}
 quizQ={q:picks[0],options:[...picks].sort(()=>Math.random()-.5)};
 quizPicked=null;
}

function renderBrowser(cat){
 const info=catInfo(cat);
 setSub(cat==='teen'?'Teen & Gen Alpha slang, decoded and cited':`${info.emoji} ${info.label} — ${info.blurb}`);
 const st=browserState[cat]||(browserState[cat]={q:'',age:'',diff:'',trend:false,saved:false,expanded:null});
 const pool=TERMS.filter(t=>inPack(t,cat));
 const sv=savedIds();
 const nq=st.q.trim().toLowerCase();
 const filtered=pool.filter(t=>{
  if(st.age&&t.ageGroup!==st.age)return false;
  if(st.diff&&t.difficulty!==st.diff)return false;
  if(st.trend&&!t.trending)return false;
  if(st.saved&&!sv.includes(t.id))return false;
  if(nq){const hay=(t.term+' '+t.definition+' '+(t.example||'')+' '+(t.tags||[]).join(' ')).toLowerCase();if(!hay.includes(nq))return false}
  return true;
 });
 const groups=new Map();
 for(const t of filtered){const c=t.term[0].toUpperCase();const k=/[A-Z]/.test(c)?c:'#';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)}
 const letters=[...groups.keys()].sort((a,b)=>a==='#'?-1:b==='#'?1:a.localeCompare(b));
 const nFilters=[st.age,st.diff,st.trend,st.saved,nq].filter(Boolean).length;
 let html='';
 if(cat==='safety')html+=`<div class="safety-note"><strong>⚠️ A note for parents:</strong> seeing one of these terms isn\u2019t proof of anything — context matters, and many double as jokes. Use them as conversation starters, not accusations. Terms marked ⚠️ are the ones Bark and safety experts flag as higher-risk signals.</div>`;
 if(cat==='emoji')html+=`<div class="safety-note green"><strong>🙂 How to read this:</strong> emojis are context-dependent — a 🍑 in a grocery list is a peach. These are the coded meanings documented by Bark\u2019s and Axis\u2019s emoji guides.</div>`;
 if(cat!=='teen')html+=`<a class="back-link" href="#/explore">← All jargon worlds</a>`;
 html+=`
  <div class="glossary-toolbar">
   <div class="search-wrap"><span class="search-icon">🔍</span>
    <input class="search-input" id="bsearch" type="search" placeholder="Type to filter instantly…" value="${esc(st.q)}" aria-label="Search terms">
   </div>
   <button class="dice-btn" id="bdice" title="Surprise me" aria-label="Open a random term">🎲</button>
  </div>`;
 if(cat==='teen'){
  html+=`<div class="chip-row" role="group" aria-label="Filter by age group">
   <button class="chip${st.age===''?' active':''}" data-fage="">All ages</button>
   ${AGE_GROUPS.map(g=>`<button class="chip${st.age===g.id?' active':''}" data-fage="${g.id}">${g.emoji} ${esc(g.label)}</button>`).join('')}
  </div>`;
 }
 html+=`<div class="chip-row" role="group" aria-label="More filters" style="padding-top:0">
  ${[['easy','🟢 Easy'],['medium','🟡 Medium'],['hard','🔴 Cryptic']].map(([id,lb])=>`<button class="chip${st.diff===id?' active':''}" data-fdiff="${id}">${lb}</button>`).join('')}
  ${cat==='teen'?`<button class="chip${st.trend?' active':''}" id="ftrend">🔥 Trending</button>`:''}
  <button class="chip${st.saved?' active':''}" id="fsaved">🔖 Saved</button>
 </div>
 <p class="count-line">${filtered.length} of ${pool.length} terms${nFilters?` · <button class="link-btn" id="fclear">clear filters ✕</button>`:''}</p>`;
 if(filtered.length===0){
  html+=`<div class="empty-state"><div class="empty-emoji">🫥</div><h3>No matches</h3><p>Nothing fits those filters.</p><div style="margin-top:14px"><button class="btn small" id="fclear2">Clear filters</button></div></div>`;
 }else{
  for(const L of letters){
   html+=`<h2 class="letter-header" id="letter-${L==='#'?'num':L}">${L}</h2><div class="card-list">`;
   for(const t of groups.get(L)){
    const exp=st.expanded===t.id;
    const saved=sv.includes(t.id);
    const alsoIn=[t.category,...(t.related||[])].filter((c,i,a)=>a.indexOf(c)===i);
    html+=`<div class="x-card${exp?' expanded':''}" id="term-${t.id}">
     <button class="x-card-head" data-expand="${t.id}" aria-expanded="${exp}">
      <span class="term-emoji">${esc(t.emoji||'💬')}</span>
      <span class="x-card-title"><span class="term-name">${esc(t.term)}</span>${exp?'':`<span class="x-card-peek">${esc(t.definition)}</span>`}</span>
      ${badge(t,cat)}<span class="x-chevron${exp?' open':''}">▾</span>
     </button>
     ${exp?`<div class="x-card-body">
      <p class="x-def">${esc(t.definition)}</p>
      ${t.say?`<p class="x-say">🗣️ say: \u201C${esc(t.say)}\u201D</p>`:''}
      ${t.example?`<p class="example-quote" style="margin:8px 0">${esc(t.example)}</p>`:''}
      <div class="meta-row">
       ${cat==='teen'&&t.category==='teen'?`<span class="badge age">${ageInfo(t.ageGroup).emoji} ${esc(ageInfo(t.ageGroup).label)}</span>`:''}
       <span class="badge" style="background:rgba(167,139,250,.14);color:var(--accent)">${esc(diffInfo(t.difficulty).label)}</span>
       ${(t.tags||[]).slice(0,4).map(tag=>`<span class="tag-pill">#${esc(tag)}</span>`).join('')}
      </div>
      ${alsoIn.length>1?`<div class="xlink-row"><span class="xlink-label">Lives in:</span>${alsoIn.map(c=>`<a class="xlink-chip${c===cat?' here':''}" href="${c==='teen'?'#/glossary':'#/pack/'+c}">${catInfo(c).emoji} ${esc(catInfo(c).label)}</a>`).join('')}</div>`:''}
      <div class="x-actions">
       <button class="btn small${saved?' saved-state':''}" data-save="${t.id}">${saved?'🔖 Saved':'🔖 Save'}</button>
       <a class="btn small" href="#/term/${t.id}">Full entry + notes →</a>
      </div>
     </div>`:''}
    </div>`;
   }
   html+='</div>';
  }
 }
 $('#main').innerHTML=html;
 document.querySelectorAll('.az-rail').forEach(e=>e.remove());
 if(letters.length>1){
  const rail=document.createElement('nav');rail.className='az-rail';rail.setAttribute('aria-label','Jump to letter');
  rail.innerHTML=letters.map(L=>`<button class="az-letter" data-jump="${L==='#'?'num':L}">${L}</button>`).join('');
  document.body.appendChild(rail);
  rail.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('letter-'+b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'})}));
 }
 const redraw=()=>renderBrowser(cat);
 $('#bsearch').addEventListener('input',e=>{st.q=e.target.value;clearTimeout(st._t);st._t=setTimeout(()=>{const pos=e.target.selectionStart;redraw();const el=$('#bsearch');el.focus();el.setSelectionRange(pos,pos)},200)});
 $('#bdice').addEventListener('click',()=>{
  if(!filtered.length)return;
  const pick=filtered[Math.floor(Math.random()*filtered.length)];
  st.expanded=pick.id;redraw();
  requestAnimationFrame(()=>{const el=document.getElementById('term-'+pick.id);if(el){el.classList.add('flash');el.scrollIntoView({behavior:'smooth',block:'center'})}});
 });
 document.querySelectorAll('[data-fage]').forEach(b=>b.addEventListener('click',()=>{st.age=st.age===b.dataset.fage?'':b.dataset.fage;redraw()}));
 document.querySelectorAll('[data-fdiff]').forEach(b=>b.addEventListener('click',()=>{st.diff=st.diff===b.dataset.fdiff?'':b.dataset.fdiff;redraw()}));
 const ft=$('#ftrend');if(ft)ft.addEventListener('click',()=>{st.trend=!st.trend;redraw()});
 const fsv=$('#fsaved');if(fsv)fsv.addEventListener('click',()=>{st.saved=!st.saved;redraw()});
 ['fclear','fclear2'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('click',()=>{browserState[cat]={q:'',age:'',diff:'',trend:false,saved:false,expanded:null};redraw()})});
 document.querySelectorAll('[data-expand]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.expand);st.expanded=st.expanded===id?null:id;redraw()}));
 document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleSaved(Number(b.dataset.save));redraw()}));
}

function renderExplore(){
 setSub('Every dialect of the internet, one decoder');
 const counts={};TERMS.forEach(t=>{counts[t.category]=(counts[t.category]||0)+1;(t.related||[]).forEach(r=>counts[r]=(counts[r]||0)+1)});
 $('#main').innerHTML=`
  <p class="explore-intro">Teen slang is just the beginning. Pick a jargon world to decode — every entry cites a published reference.</p>
  <div class="pack-list">
   ${CATEGORIES.map(c=>`
    <a class="pack-card" style="--pack:${c.color}" href="${c.id==='teen'?'#/glossary':'#/pack/'+c.id}">
     <span class="pack-emoji">${c.emoji}</span>
     <span class="pack-info"><span class="pack-title">${esc(c.label)}</span><span class="pack-blurb">${esc(c.blurb)}</span></span>
     <span class="pack-count">${counts[c.id]||0}<span class="pack-count-label">terms</span></span>
     <span class="pack-arrow">›</span>
    </a>`).join('')}
  </div>`;
}
function renderPack(id){
 const cat=CATEGORIES.find(c=>c.id===id&&c.id!=='teen');
 if(!cat){setSub('Unknown pack');$('#main').innerHTML=`<a class="back-link" href="#/explore">← Back to Explore</a><div class="empty-state"><div class="empty-emoji">🗺️</div><h3>Unknown pack</h3></div>`;return}
 renderBrowser(cat.id);
}

function renderTrending(){
 setSub('Verified daily against live news — we don\u2019t invent what\u2019s hot');
 const snap=DATA.trendingSnapshot;
 const radar=DATA.radarSnapshot;
 const trending=TERMS.filter(t=>t.trending).sort((a,b)=>(b.isWoty-a.isWoty)||a.term.localeCompare(b.term));
 const feedOk=(snap?.sourcesChecked||[]).filter(s=>s.ok).length;
 const guideOk=(radar?.results||[]).filter(r=>r.ok).length;
 const total=(snap?.sourcesChecked||[]).length+(radar?.results||[]).length;
 const candidates=(radar?.results||[]).filter(r=>r.ok).flatMap(r=>r.newCandidates.map(t=>({t,s:r.source})));
 const newGuides=(radar?.discovery||[]).filter(d=>d.ok).flatMap(d=>d.newGuideUrls);
 $('#main').innerHTML=`
  <details class="verify-panel">
   <summary class="verify-summary">
    <span class="verify-summary-title">🛡️ Daily verification</span>
    <span class="verify-summary-line">${snap?`${feedOk+guideOk===total?'✓':'⚠'} ${feedOk+guideOk}/${total} sources · ${snap.matchedCount} headline match${snap.matchedCount===1?'':'es'} · ${new Date(DATA.generatedAt).toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric'})}${newGuides.length?` · 🆕 ${newGuides.length} new guide`:''}${candidates.length?` · ${candidates.length} candidates`:''}`:'no data'}</span>
    <span class="verify-chevron">▾</span>
   </summary>
   <div class="verify-body">
    <div class="static-note">📅 Rebuilt daily by an automated job (GitHub Actions) that fetches live news feeds and re-scans the Bark/Axis parent guides, then republishes this site. Generated: <strong>${new Date(DATA.generatedAt).toLocaleString('en-US',{timeZone:'America/New_York'})} ET</strong></div>
    ${snap?`
    <div>News-feed verification · ${snap.matchedCount} headline match${snap.matchedCount===1?'':'es'}</div>
    <ul>${snap.sourcesChecked.map(s=>`<li>${s.ok?`<span class="source-ok">✓ ${esc(s.name)} — ${s.items} items read</span>`:`<span class="source-fail">✕ ${esc(s.name)} — ${esc(s.error)}</span>`}</li>`).join('')}</ul>
    ${snap.wiktionarySample?.length?`<div style="margin-top:6px">Wiktionary spot-check: ${snap.wiktionarySample.map(w=>`${esc(w.term)} ${w.confirmed===true?'✓':w.confirmed===false?'—':'?'}`).join(' · ')}</div>`:''}
    ${snap.headlinesSample?.length?`<details style="margin-top:8px"><summary>Headlines checked (${snap.headlinesSample.length} shown)</summary><ul>${snap.headlinesSample.map(h=>`<li>${safeHref(h.link)?`<a href="${safeHref(h.link)}" target="_blank" rel="noopener noreferrer">${esc(h.title)}</a>`:esc(h.title)}</li>`).join('')}</ul></details>`:''}`:''}
    ${radar?`
    <div style="border-top:1px dashed var(--border);margin-top:10px;padding-top:10px">📡 Guide radar — ${radar.results.length} watched sources</div>
    <ul>${radar.results.map(r=>`<li>${r.ok?`<span class="source-ok">✓ ${esc(r.source)} — ${r.scanned} terms, ${r.newCandidates.length===0?'library current':r.newCandidates.length+' new candidate(s)'}</span>`:`<span class="source-fail">✕ ${esc(r.source)} — ${esc(r.error)}</span>`}</li>`).join('')}</ul>
    ${candidates.length?`<details style="margin-top:6px"><summary>New term candidates (review-only — definitions are never auto-written)</summary><ul>${candidates.map(c=>`<li>\u201C${esc(c.t)}\u201D <em style="color:var(--text-faint)">(${esc(c.s)})</em></li>`).join('')}</ul></details>`:''}
    <div style="border-top:1px dashed var(--border);margin-top:10px;padding-top:10px">🔭 New-guide discovery</div>
    <ul>${radar.discovery.map(d=>`<li>${d.ok?`<span class="${d.newGuideUrls.length?'source-warn':'source-ok'}">${d.newGuideUrls.length?'🆕':'✓'} ${esc(d.index)} — ${d.linksScanned} links${d.newGuideUrls.length?', '+d.newGuideUrls.length+' possible new guide(s)':''}</span>`:`<span class="source-fail">✕ ${esc(d.index)} — ${esc(d.error)}</span>`}</li>`).join('')}</ul>
    ${newGuides.length?`<ul>${newGuides.map(u=>`<li><a href="${safeHref(u)||'#'}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')}</ul>`:''}`:''}
   </div>
  </details>
  <p class="count-line">${trending.length} trending term${trending.length===1?'':'s'}</p>
  <div class="card-list">
   ${trending.map(t=>`
    <a class="x-card" href="#/term/${t.id}" style="display:block">
     <span class="x-card-head" style="cursor:pointer">
      <span class="term-emoji">${esc(t.emoji||'💬')}</span>
      <span class="x-card-title"><span class="term-name">${esc(t.term)}</span><span class="x-card-peek">${esc(t.definition)}</span></span>
      ${t.isWoty?'<span class="badge woty">WOTY</span>':'<span class="badge trend">🔥</span>'}
     </span>
    </a>
    ${t.trendingEvidence?.headline?`<p class="evidence-line" style="padding:0 4px">📰 <strong>Evidence:</strong> \u201C${esc(t.trendingEvidence.headline)}\u201D <em>(${esc(t.trendingEvidence.feed||'')})</em></p>`:''}
   `).join('')}
  </div>`;
}

function renderSaved(){
 setSub('Your bookmarks & notes — stored in this browser only');
 const ids=savedIds();
 const byId=new Map(TERMS.map(t=>[t.id,t]));
 const terms=ids.map(id=>byId.get(id)).filter(Boolean);
 const notes=lsGet(LS.notes,{});
 if(terms.length===0){
  $('#main').innerHTML=`<div class="empty-state"><div class="empty-emoji">🔖</div><h3>Nothing saved yet</h3><p>Tap \u201CSave\u201D on any term to keep it here. Saved terms and notes never leave this browser.</p><div style="margin-top:14px"><a class="btn small primary" href="#/glossary" style="display:inline-flex">Browse the glossary</a></div></div>`;
  return;
 }
 $('#main').innerHTML=`
  <p class="count-line">${terms.length} saved term${terms.length===1?'':'s'}</p>
  <div class="card-list">
   ${terms.map(t=>`
    <a class="x-card" href="#/term/${t.id}" style="display:block">
     <span class="x-card-head" style="cursor:pointer">
      <span class="term-emoji">${esc(t.emoji||'💬')}</span>
      <span class="x-card-title"><span class="term-name">${esc(t.term)}</span><span class="x-card-peek">${esc(t.definition)}</span></span>
      ${badge(t,null)}
     </span>
    </a>
    ${notes[String(t.id)]?`<p class="evidence-line" style="padding:0 4px">📝 <strong style="color:var(--amber)">Your note:</strong> ${esc(notes[String(t.id)])}</p>`:''}
   `).join('')}
  </div>`;
}

function renderTerm(id){
 const t=TERMS.find(x=>x.id===id);
 if(!t){$('#main').innerHTML=`<a class="back-link" href="#/glossary">← Back to glossary</a><div class="empty-state"><div class="empty-emoji">🫥</div><h3>Term not found</h3></div>`;return}
 const isTeen=t.category==='teen';
 const back=isTeen?'#/glossary':'#/pack/'+t.category;
 setSub(isTeen?`Filed under ${ageInfo(t.ageGroup).label}`:'From the jargon packs');
 const saved=savedIds().includes(t.id);
 const alsoIn=[t.category,...(t.related||[])].filter((c,i,a)=>a.indexOf(c)===i);
 $('#main').innerHTML=`
  <a class="back-link" href="${back}">← Back to ${isTeen?'glossary':'the pack'}</a>
  <div class="detail-hero">
   <div class="detail-emoji">${esc(t.emoji||'💬')}</div>
   <h2 class="detail-term">${esc(t.term)}</h2>
   ${t.say?`<p class="detail-say">say: \u201C${esc(t.say)}\u201D</p>`:''}
   <div class="meta-row" style="justify-content:center">
    ${isTeen?`<span class="badge age">${ageInfo(t.ageGroup).emoji} ${esc(ageInfo(t.ageGroup).label)}</span>`:''}
    <span class="badge" style="background:rgba(167,139,250,.14);color:var(--accent)">${esc(diffInfo(t.difficulty).label)}</span>
    ${t.isWoty?'<span class="badge woty">🏆 Word of the Year</span>':''}
    ${t.trending?'<span class="badge trend">🔥 Trending</span>':''}
    ${(t.tags||[]).includes('parent-alert')?'<span class="badge alert">⚠️ Parent alert</span>':''}
   </div>
   ${alsoIn.length>1?`<div class="xlink-row" style="justify-content:center;border-top:none;padding-top:4px"><span class="xlink-label">Lives in:</span>${alsoIn.map(c=>`<a class="xlink-chip" href="${c==='teen'?'#/glossary':'#/pack/'+c}">${catInfo(c).emoji} ${esc(catInfo(c).label)}</a>`).join('')}</div>`:''}
  </div>
  <div class="btn-row">
   <button class="btn${saved?' saved-state':''}" id="dsave">${saved?'🔖 Saved':'🔖 Save'}</button>
  </div>
  <section class="section-card"><h3 class="section-label">What it means</h3><p>${esc(t.definition)}</p></section>
  ${t.example?`<section class="section-card"><h3 class="section-label">Heard in the wild</h3><p class="example-quote">${esc(t.example)}</p></section>`:''}
  ${t.notes?`<section class="section-card"><h3 class="section-label">Origin & notes</h3><p>${esc(t.notes)}</p></section>`:''}
  ${t.trending&&t.trendingEvidence?`<section class="section-card"><h3 class="section-label">Why it\u2019s marked trending</h3><p style="font-size:14px"><strong style="color:var(--pink)">\u201C${esc(t.trendingEvidence.headline)}\u201D</strong></p><p style="font-size:12.5px;color:var(--text-faint);margin-top:6px">Source feed: ${esc(t.trendingEvidence.feed||'')}${safeHref(t.trendingEvidence.link)?` · <a href="${safeHref(t.trendingEvidence.link)}" target="_blank" rel="noopener noreferrer">read the story ↗</a>`:''}</p></section>`:''}
  ${t.sourceName||t.sourceUrl?`<section class="section-card"><h3 class="section-label">Documented source</h3><p style="font-size:14px">${safeHref(t.sourceUrl)?`<a href="${safeHref(t.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(t.sourceName||t.sourceUrl)} ↗</a>`:esc(t.sourceName)}</p></section>`:''}
  ${(t.tags||[]).length?`<section class="section-card"><h3 class="section-label">Tags</h3><div>${t.tags.map(tag=>`<span class="tag-pill" style="margin:0 4px 4px 0">#${esc(tag)}</span>`).join('')}</div></section>`:''}
  <section class="section-card">
   <h3 class="section-label">My private note</h3>
   <textarea class="note-area" id="dnote" placeholder="e.g. \u201CMaya said this at dinner — she says it\u2019s ironic now.\u201D Stays in this browser only.">${esc(getNote(t.id))}</textarea>
   <p class="form-hint" id="dnote-status"></p>
  </section>`;
 $('#dsave').addEventListener('click',()=>{toggleSaved(t.id);renderTerm(id)});
 let nt;$('#dnote').addEventListener('input',e=>{
  $('#dnote-status').textContent='Saving…';clearTimeout(nt);
  nt=setTimeout(()=>{setNote(t.id,e.target.value);$('#dnote-status').textContent='Saved to this browser ✓';setTimeout(()=>{$('#dnote-status').textContent=''},2000)},500);
 });
}

fetch('data.json').then(r=>{
 if(!r.ok)throw new Error('HTTP '+r.status);
 return r.json();
}).then(d=>{DATA=d;TERMS=d.terms;route()}).catch(e=>{
 $('#main').innerHTML=`<div class="empty-state"><div class="empty-emoji">😵</div><h3>Couldn\u2019t load the glossary data</h3><p>${esc(String(e.message||e))} — data.json must sit next to index.html.</p><div style="margin-top:14px"><button class="btn small primary" onclick="location.reload()">↻ Retry</button></div></div>`;
});
</script>
</body>
</html>
