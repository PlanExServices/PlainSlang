# Render.com blueprint — deploys the full PlainSlang server edition.
# Connect this repo on https://dashboard.render.com → New → Blueprint.
services:
  - type: web
    name: plainslang
    runtime: node
    plan: free # upgrade to 'starter' to attach the persistent disk below
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: PLAINSLANG_DB_PATH
        value: /var/data/plainslang.db
    # Persistent disk so the SQLite DB (and any terms you add) survives deploys.
    # NOTE: disks require a paid plan; on the free plan remove this block and
    # PLAINSLANG_DB_PATH above — the app will auto-reseed its 670 terms on each
    # deploy, but user-added terms won't persist across restarts.
    disk:
      name: plainslang-data
      mountPath: /var/data
      sizeGB: 1
