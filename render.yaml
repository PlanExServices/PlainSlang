# Render.com blueprint — PlainSlang server edition (free tier + Supabase Postgres).
# 1. Create a free Supabase project, copy its connection string (Session pooler,
#    port 5432 — NOT the transaction pooler on 6543, LISTEN/NOTIFY needs sessions).
# 2. In Render: set DATABASE_URL as a secret env var on this service.
services:
  - type: web
    name: plainslang
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        sync: false # set in dashboard — Supabase connection string (secret)
