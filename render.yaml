# Render.com blueprint — deploys the full PlainSlang server edition.
# Connect this repo on https://dashboard.render.com -> New -> Blueprint.
services:
  - type: web
    name: plainslang
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
